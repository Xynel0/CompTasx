name: Build APK de teste

on:
  push:
    branches-ignore:
      - main

    paths:
      - 'app/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Permitir execução do gradle wrapper
        run: chmod +x ./gradlew

      - name: Gerar apk de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar apk nos artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.ref_name }}-${{ github.run_number }}
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
